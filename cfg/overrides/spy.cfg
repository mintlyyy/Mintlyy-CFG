// ============================================================================
//   SPY.CFG — roda toda vez que você vira Spy (ou troca de classe)
//   Instalar em: tf/cfg/overrides/spy.cfg
//
//   Aqui só tem coisa de Spy. Gráfico/som/rede = modules.cfg.
//   Binds gerais/mouse = autoexec.cfg.
// ============================================================================

// Menu de disfarce "conciso": abre com 1 tela e você navega no teclado
// (mais teclas, mas nunca erra o clique com o mouse no meio da luta).
// Prefere o menu completo (clica na cara da classe)?  tf_simple_disguise_menu 0
tf_simple_disguise_menu 1

// ─────────────────────────────────────────────────────────────────────────────
//  BINDS DE SPY (reforçados aqui: classe é onde eles importam)
// ─────────────────────────────────────────────────────────────────────────────
bind "MOUSE3"     "slot4"          // atalho: abre o menu de disfarce
bind "CAPSLOCK"   "voicemenu 1 1"  // chamada "Spy!" (aponte pro alvo e chame)
bind "MOUSE4"     "lastdisguise"   // repete o último disfarce
bind "b"          "lastdisguise"
bind "MOUSE5"     "slot2"          // saca o SAPPERS
bind "1"          "slot1"          // revolver
bind "2"          "slot2"          // sapper
bind "3"          "slot3"          // faca
bind "4"          "slot4"          // kit de disfarce
bind "q"          "lastinv"

// ─────────────────────────────────────────────────────────────────────────────
//  🎭 OS 3 SEGREDOS DO DISFARCE (o que faz o disfarce "colar")
//
//  1) A ARMA MOSTRADA PELO DISFARCE = O SLOT QUE VOCÊ ESTÁ SEGURANDO:
//       seu slot1 (revolver) -> arma primária da classe
//       seu slot2 (sapper)   -> arma secundária da classe  (medigun, sticky...)
//       seu slot3 (faca)     -> arma corpo a corpo          (wrench, kukri...)
//     Por isso: disfarce de MEDIC segurando SAPPER = medigun na mão. Disfarce
//     de ENGINEER segurando FACA = wrench na mão. Segure o slot certo ANTES
//     de abrir o menu.
//  2) Já disfarçado, 1/2/3 troca a arma do disfarce SEM refazer o disfarce.
//  3) Disfarce de time (-2 no console) serve pra andar no meio do INIMIGO
//     fingindo ser "aliado deles" e enganar sniper/engenheiro de longe.
//     Pelo menu: escolha a classe e depois o time.
// ─────────────────────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────────────────────
//  💀 DEAD RINGER (sua loadout principal — DR + Kunai/Big Earner)
//    • MOUSE2 = feign death. A morte é FALSA: você fica invisível e pode andar.
//    • killbind (k) NÃO ativa o DR — se quiser medo de verdade, use MOUSE2.
//    • ragdolls=medium no modules.cfg é o que te deixa ver o CORPO FALSO
//      dos DRs inimigos: corpo que "desliza"/não tem dono = fake. Não desligue.
//    • Depois do feign, a recarga do relógio depende do dano recebido:
//      leve dano de propósito pra recarregar mais rápido e voltar pro combate.
//    • Kunai: backstab = +75 de vida (máx. 195 com over-heal de kill? na prática
//      você vira tanque depois de uma facada). Big Earner: +velocidade e
//      recarga de relógio no kill. Jogue em cima do desespero inimigo.
// ─────────────────────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────────────────────
//  🌐 REDE DO SPY
//  O mastercomfig já aplica o preset de rede do Spy sozinho (net_spy:
//  cl_interp_ratio 1 = 15ms de lerp + cl_smooth 0). Isso é o melhor pra
//  facada registrar. A linha abaixo só reafirma, caso algo troque no meio
//  da partida. Quer 30ms (mais seguro contra perda de pacote)?
//  Rode:  net_spy_safe   |  pra voltar:  net_spy_fast
// ─────────────────────────────────────────────────────────────────────────────
net_spy

// Segurança: relógio sempre recarregando sozinho no revolver
cl_autoreload 1

echo "[mintlyy-cfg] spy.cfg OK — MOUSE3/CAPSLOCK/4 = disfarce | MOUSE5 = sapper | MOUSE4 = re-disfarce"
