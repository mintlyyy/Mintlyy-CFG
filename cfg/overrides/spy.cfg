// ============================================================================
//  SPY — roda toda vez que voce troca para a classe
// ============================================================================

tf_simple_disguise_menu 1     // menu de disfarce simplificado

// ──────────────────────────────────────────────────────────────────────────
// DISFARCE DIRETO + ARMA CERTA
//
// A arma que o DISFARCE exibe e o slot que VOCE esta segurando:
//   slot1 = primaria | slot2 = secundaria | slot3 = corpo a corpo
// Cada bind abaixo ja troca seu slot pro disfarce parecer natural.
// Ja disfarcado, aperte 1/2/3 para trocar a arma visivel do disfarce.
// ──────────────────────────────────────────────────────────────────────────
bind F1 "disguise 8 -1; slot1"   // SPY      — revolver
bind F5 "disguise 2 -1; slot1"   // SNIPER   — sniper rifle
bind F6 "disguise 3 -1; slot1"   // SOLDIER  — rocket launcher
bind F4 "disguise 4 -1; slot1"   // DEMOMAN  — sticky launcher
bind F2 "disguise 5 -1; slot2"   // MEDIC    — medigun (o que ele segura 99% do tempo)
bind F3 "disguise 6 -1; slot1"   // HEAVY    — minigun
bind F7 "disguise 7 -1; slot1"   // PYRO     — lanca-chamas
bind F8 "disguise 1 -1; slot1"   // SCOUT    — scattergun
bind F9 "disguise 9 -1; slot3"   // ENGINEER — wrench  (* NOVO: engineer nao existia na cfg antiga)

// Prefere disfarcar SEM trocar sua arma (faca sempre pronta na mao)?
// Comente o bloco de cima e descomente este:
// bind F1 "disguise 8 -1"
// bind F2 "disguise 5 -1"
// bind F3 "disguise 6 -1"
// bind F4 "disguise 4 -1"
// bind F5 "disguise 2 -1"
// bind F6 "disguise 3 -1"
// bind F7 "disguise 7 -1"
// bind F8 "disguise 1 -1"
// bind F9 "disguise 9 -1"

// Dica: troque -1 por -2 em qualquer bind acima para disfarcar de ALIADO
// (util para se misturar ao seu time em flanks e enganar sniper inimigo).

// ──────────────────────────────────────────────────────────────────────────
// SAPPER / REDISFARCE
// ──────────────────────────────────────────────────────────────────────────
bind b     lastdisguise       // re-disfarce instantaneo do ultimo usado
bind MOUSE4 lastdisguise
bind MOUSE5 slot2             // * FIX: MOUSE5 estava em "+sap", comando que NAO
                              // existe no TF2 (era um alias que nunca foi criado
                              // — ou seja, botao morto). Agora saca o sapper
                              // com um toque.

// Versao classica do script de sap (segura = saca e sabota, solta = volta pra
// arma anterior). NAO esta ativo porque controla seu personagem — ative por
// sua conta se quiser testar:
// alias +sap  "slot2; +attack"
// alias -sap  "-attack; lastinv"
// bind MOUSE5 +sap

// ──────────────────────────────────────────────────────────────────────────
// Rede do Spy: o mastercomfig (snapshot_buffer=auto no modules.cfg) ja aplica
// o preset de rede do Spy automaticamente ao trocar de classe. Nao e preciso
// mais nada aqui.
// ──────────────────────────────────────────────────────────────────────────

echo "[mintlyy-cfg] spy.cfg OK — F1..F9 disfarces (engineer agora no F9), MOUSE5 = sapper"
