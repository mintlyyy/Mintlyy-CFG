// ============================================================================
//   SPY_FKEYS.CFG — OPCIONAL: disfarce direto em tecla (F1..F9)
//   Ativar no console:  spyfkeys       (ou: exec overrides/spy_fkeys)
//
//   Você escolheu jogar pelo MENU (MOUSE3 / 4). Este arquivo é o atalho
//   "de campeonato": 1 tecla = disfarce pronto, sem abrir menu nenhum.
//   Dica: quem usa isso costuma disfarçar em movimento, sem parar de andar.
// ============================================================================

// A arma mostrada pelo disfarce segue o slot que você está segurando
// (slot1 = primária, slot2 = secundária, slot3 = corpo a corpo).
// Cada bind abaixo já troca pro slot certo junto com o disfarce:

bind "F1" "disguise 8 -1; slot1"   // SPY      -> revolver
bind "F2" "disguise 5 -1; slot2"   // MEDIC    -> medigun
bind "F3" "disguise 6 -1; slot1"   // HEAVY    -> minigun
bind "F4" "disguise 4 -1; slot1"   // DEMOMAN  -> sticky
bind "F5" "disguise 2 -1; slot1"   // SNIPER   -> rifle
bind "F6" "disguise 3 -1; slot1"   // SOLDIER  -> rocket
bind "F7" "disguise 7 -1; slot1"   // PYRO     -> lança-chamas
bind "F8" "disguise 1 -1"          // SCOUT    -> scattergun
bind "F9" "disguise 9 -1; slot3"   // ENGINEER -> wrench

// Quer disfarçar SEM largar a faca da mão? Comente o bloco acima e use este:
// bind "F1" "disguise 8 -1"
// bind "F2" "disguise 5 -1"
// bind "F3" "disguise 6 -1"
// bind "F4" "disguise 4 -1"
// bind "F5" "disguise 2 -1"
// bind "F6" "disguise 3 -1"
// bind "F7" "disguise 7 -1"
// bind "F8" "disguise 1 -1"
// bind "F9" "disguise 9 -1"

// DICA PRO: troque o -1 por -2 pra disfarçar de ALIADO (andar no meio do
// inimigo fingindo ser "um deles"). Ex.:  bind "F5" "disguise 2 -2; slot1"

echo "[mintlyy-cfg] spy_fkeys.cfg OK — F1..F9 = disfarce direto"
