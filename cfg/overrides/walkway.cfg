// ============================================================================
//   WALKWAY.CFG — treino de Spy em servidor local
//   Ativar no console:  walkway
//   (precisa do mapa tr_walkway_rc2 instalado em tf/maps)
// ============================================================================

// Servidor local: aqui cvars de servidor/cheat funcionam de verdade
host_thread_mode 0
sv_cheats 1
sv_allow_point_servercommand always
sv_infinite_ammo 1
mp_tournament 0
mp_limitteams 0
mp_autoteambalance 0
tf_forced_holiday 0
tf_force_holidays_off 1
tf_weapon_criticals 0            // sem crit aleatório atrapalhando a leitura
tf_use_fixed_weaponspreads 1     // spread fixo: sua mira é o fator real
tf_damage_disablespread 1
tf_medieval 0
tf_bot_quota 0                   // sem bot do jogo atrapalhando

// Treino de Spy que vale a pena no walkway:
//   • facada é POSIÇÃO, não mira: treine entrar pelas costas andando (nunca
//     de frente), matar em 1,4s e sair pela rota
//   • treine o "stairs stab" (facada descendo escada) e o "matador stab"
//   • treine disfarce saindo de trás de cobertura: disfarce -> espera -> anda
//   • teste seu tempo de decloak/feign death do Dead Ringer aqui
map tr_walkway_rc2
