// ============================================================================
//  mintlyy-cfg v2 — AUTOEXEC (Spy Main Edition)
//  Instalar em: tf/cfg/overrides/autoexec.cfg   (requer mastercomfig instalado)
//
//  Graficos/som/rede agora ficam TODOS no modules.cfg (mesma pasta).
//  Este arquivo tem so: binds, aliases e preferencias pessoais.
//  Assim acabam os conflitos da versao antiga (fps_max 91 x fpscap=120,
//  r_shadows 0 x shadows=low, som degradado, tweaks de rede perigosos...).
// ============================================================================

// ──────────────────────────────────────────────────────────────────────────
// 1. NULL-CANCELING MOVEMENT (addon oficial do mastercomfig — credito: povohat)
//    Cancela direcoes opostas apertadas juntas: voce nunca "trava" andando.
//    Agora LIGADO PARA TODAS AS CLASSES direto no launch (antes dependia do
//    spy.cfg, que chamava um arquivo quebrado).
// ──────────────────────────────────────────────────────────────────────────
alias +mf "-back;+forward;alias cf +forward"
alias +mb "-forward;+back;alias cb +back"
alias +ml "-moveright;+moveleft;alias cl +moveleft"
alias +mr "-moveleft;+moveright;alias cr +moveright"
alias -mf "-forward;cb;alias cf"
alias -mb "-back;cf;alias cb"
alias -ml "-moveleft;cr;alias cl"
alias -mr "-moveright;cl;alias cr"
alias cf
alias cb
alias cl
alias cr

alias nullc_on  "bind w +mf; bind s +mb; bind a +ml; bind d +mr; echo [null-cancel] LIGADO"
alias nullc_off "bind w +forward; bind s +back; bind a +moveleft; bind d +moveright; echo [null-cancel] DESLIGADO"
bind w +mf
bind s +mb
bind a +ml
bind d +mr

// Liga/desliga no console a qualquer momento:  null  ou  nonull
alias null   "exec overrides/null"
alias nonull "exec overrides/nonull"

// ──────────────────────────────────────────────────────────────────────────
// 2. MOUSE — precisao crua
// ──────────────────────────────────────────────────────────────────────────
m_rawinput 1                  // input direto (ignora processamento do cursor do Windows)
m_customaccel 0               // zero aceleracao
m_filter 0                    // zero suavizacao
m_mousespeed 0                // zero "enhance pointer precision"
m_mouseaccel1 0
m_mouseaccel2 0
zoom_sensitivity_ratio 0.7934714  // 1:1 no zoom (so importa se pegar rifle de Sniper do chao)

// ──────────────────────────────────────────────────────────────────────────
// 3. BINDS
//    (Seu layout geral — disguise, sapper, viewmodel toggles — fica no
//     config.cfg e no spy.cfg. Nada de unbindall aqui.)
// ──────────────────────────────────────────────────────────────────────────
bind mwheelup +jump           // bhop no scroll
bind mwheeldown +jump
bind g +taunt
bind k kill                   // killbind (atencao: kill NAO ativa o Dead Ringer)
bind F10 "toggle net_graph 0 4"  // FPS/ping/choke sob demanda (net_graph fixo no hud custa fps)

// Reload que limpa decalques (sangue/buracos de bala) da tela — classico e seguro
alias +reloads "+reload; r_cleardecals"
alias -reloads "-reload"
bind r +reloads

// Treino: digite  walkway  no console
alias walkway "exec overrides/walkway"

// ──────────────────────────────────────────────────────────────────────────
// 4. REDE — agora e o mastercomfig que cuida (ver modules.cfg)
//    Removidos os tweaks perigosos da versao antiga:
//      net_maxcleartime 0.001 / net_maxpacketdrop 0 / net_maxfragments 1260 /
//      net_splitrate / cl_pred_optimize 2 — podiam causar CHOKE e perda de
//      pacote (o contrario do objetivo).
//    O snapshot_buffer=auto ja aplica o preset de rede ideal do SPY sozinho.
//    Se quiser forcar o lerp minimo manual (15ms) como a cfg antiga fazia,
//    descomente as duas linhas abaixo (menos estavel, registry de facada pior
//    com perda de pacote):
// cl_interp 0
// cl_interp_ratio 1
cl_timeout 120                // aguenta travadas de rede sem disconnect

// ──────────────────────────────────────────────────────────────────────────
// 5. HUD / QUALIDADE DE VIDA
// ──────────────────────────────────────────────────────────────────────────
fov_desired 90                // FOV maximo de combate
viewmodel_fov 105
tf_use_min_viewmodels 1
hud_fastswitch 1
cl_autoreload 1               // * NOVO: revolver recarrega sozinho
cl_hud_minmode 1
tf_scoreboard_ping_as_text 1  // ping em numeros no TAB
tf_hud_target_id_disable_floating_health 1
tf_colorblindassist 1         // Jarate/Leite mais faceis de ler
hud_saytext_time 5
tf_contract_progress_show 0   // sem painel de contratos
cl_mute_all_comms 0
snd_mute_losefocus 0          // som continua quando o jogo perde foco
cl_showpos 0                  // era 1 fixo (poluicao visual) — ligue com: cl_showpos 1
net_graph 0                   // era 1 fixo — use F10 quando quiser ver
r_drawtracers_firstperson 0   // sem tracers saindo do cano (tela limpa)
cl_ragdoll_collide 0          // ragdolls sem colidir entre si (fake de DR continua 100% visivel)

echo ""
echo "=================================================="
echo "   mintlyy-cfg v2 (SPY EDITION) CARREGADA"
echo "   modules.cfg -> graficos/som/rede | fpscap 120"
echo "=================================================="
