// ============================================================================
//   mintlyy-cfg v3 — AUTOEXEC  (Spy Main Edition)
//   Instalar em: tf/cfg/overrides/autoexec.cfg   (precisa do mastercomfig)
//
//   Alvo: i5-3470 + GT 630 + 8GB + monitor 80Hz  |  main Spy (DR + Kunai)
//
//   COMO O MASTERCOMFIG CARREGA (importante):
//     comfig.cfg -> preset -> overrides/modules.cfg -> run_modules
//     -> overrides/autoexec.cfg (VOCÊ ESTÁ AQUI) -> por partida: overrides/game_overrides.cfg
//   Como este arquivo roda DEPOIS dos módulos, o que estiver aqui vence os módulos.
//   Gráfico/som/rede continua tudo em modules.cfg (não duplica aqui de propósito).
// ============================================================================


// ─────────────────────────────────────────────────────────────────────────────
//  0. HIGIENE — libera as teclas mortas que sobraram do seu config.cfg antigo
//     (binds de plugin de servidor/VR/replay que não fazem nada em servidor normal)
// ─────────────────────────────────────────────────────────────────────────────
unbind "F1"        // era disguise 8 -1  (opcional: exec overrides/spy_fkeys)
unbind "F2"        // era disguise 5 -1
unbind "F3"        // era disguise 6 -1
unbind "F4"        // era disguise 4 -1
unbind "F5"        // era disguise 2 -1
unbind "F6"        // era disguise 3 -1
unbind "F7"        // era disguise 7 -1
unbind "F8"        // era disguise 1 -1
unbind "F9"        // era vr_toggle (nada a ver com o jogo)
unbind "F11"       // era vr_reset_home_pos
unbind "F12"       // era replay_togglereplaytips
unbind "["         // era sm_thrdperson (comando de plugin; some em servidor normal)
unbind "INS"       // era yellowcycle (comando de desenvolvimento)
unbind "UPARROW"   // era ds_mark (plugin)
unbind "DOWNARROW" // era record fix; stop; ds_record (plugin)
unbind "-"         // era graphtoggle (comando de desenvolvimento)
unbind "o"         // taunt duplicado (o "g" já faz)
unbind "i"         // viewmodel_fov duplicado (o PGUP já faz)
unbind "p"         // toggle de viewmodel duplicado (o END já faz)
unbind "KP_MINUS"  // toggle de viewmodel duplicado
unbind "PAUSE"     // pause só serve em servidor local, atrapalha


// ─────────────────────────────────────────────────────────────────────────────
//  1. NULL-CANCELING MOVEMENT  (addon do mastercomfig — crédito: povohat)
//     Cancela W+S / A+D apertados juntos: você nunca "trava" no meio do duelo.
//     Console:  null  = liga   |   nonull = desliga
// ─────────────────────────────────────────────────────────────────────────────
alias +mf "-back;+forward;alias cf +forward"
alias +mb "-forward;+back;alias cb +back"
alias +ml "-moveright;+moveleft;alias cl +moveleft"
alias +mr "-moveleft;+moveright;alias cr +moveright"
alias -mf "-forward;cb;alias cf"
alias -mb "-back;cf;alias cb"
alias -ml "-moveleft;cr;alias cl"
alias -mr "-moveright;cl;alias cr"
alias cf
alias cb
alias cl
alias cr
alias nullc_on  "bind w +mf; bind s +mb; bind a +ml; bind d +mr; echo [null-cancel] LIGADO"
alias nullc_off "bind w +forward; bind s +back; bind a +moveleft; bind d +moveright; echo [null-cancel] DESLIGADO"

bind "w" "+mf"
bind "s" "+mb"
bind "a" "+ml"
bind "d" "+mr"

alias null   "exec overrides/null"
alias nonull "exec overrides/nonull"


// ─────────────────────────────────────────────────────────────────────────────
//  2. MOUSE — input cru, zero aceleração (o Spy vive de flick e 180º)
// ─────────────────────────────────────────────────────────────────────────────
m_rawinput 1                  // input direto, ignora o cursor do Windows
m_customaccel 0               // zero aceleração
m_filter 0                    // zero suavização
m_mousespeed 0                // desliga "Enhance pointer precision" do Windows
m_mouseaccel1 0
m_mouseaccel2 0
// sens 2.5 @ 1600 DPI = ~10,4 cm/360 (muito rápido).
// Tabela de referência pro mesmo DPI 1600 (detalhe no MELHORIAS.md):
//   sensitivity 2.0 -> ~13,0 cm/360 | 1.7 -> ~15,3 cm | 1.5 -> ~17,3 cm
//   1.3 -> ~20,0 cm | 1.0 -> ~26,0 cm
// Spy costuma render mais entre 15 e 25 cm/360 (facada + tiro de revolver).
// Teste uma dessas em servidor por 1-2 partidas antes de julgar.
sensitivity 2.5
zoom_sensitivity_ratio 0.7934714   // mantenha: é o 1:1 exato pro FOV 90


// ─────────────────────────────────────────────────────────────────────────────
//  3. BINDS PRINCIPAIS
// ─────────────────────────────────────────────────────────────────────────────
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"      // * com Dead Ringer: +attack2 = FEIGN DEATH
bind "MOUSE3" "slot4"         // atalho do menu de disfarce (kit de Spy)
bind "MOUSE4" "lastdisguise"  // re-disfarce instantâneo
bind "MOUSE5" "slot2"         // saca o SAPPERS com um toque
bind "MWHEELUP"   "+jump"     // bhop no scroll
bind "MWHEELDOWN" "+jump"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+attack3"
bind "'" "+moveup"
bind "/" "+movedown"
bind "1" "slot1"              // revolver
bind "2" "slot2"              // sapper
bind "3" "slot3"              // faca
bind "4" "slot4"              // kit de disfarce (menu)
bind "5" "slot5"
bind "6" "slot6"
bind "q" "lastinv"            // troca revolver <-> faca
bind "r" "+reloads"           // recarrega E limpa decalques (sangue na tela)
bind "f" "+inspect"
bind "TAB" "+showscores"
bind "BACKSPACE" "+use_action_slot_item"
bind "ESCAPE" "cancelselect"
bind "," "changeclass"
bind "." "changeteam"
bind "k" "kill"               // killbind (obs: kill NÃO dispara o Dead Ringer)
bind "g" "+taunt"
bind "l" "dropitem"
bind "m" "open_charinfo_direct"
bind "t" "impulse 201"        // spray
bind "v" "+voicerecord"
bind "e" "voicemenu 0 0"      // "MEDIC!"
bind "z" "voice_menu_1"
bind "x" "voice_menu_2"
bind "c" "voice_menu_3"
bind "y" "say"
bind "u" "say_team"
bind "h" "show_matchmaking"
bind "n" "+quickswitchmenu"
bind "j" "cl_trigger_first_notification"
bind ";" "cl_decline_first_notification"
bind "\" "show_quest_log"     // (a tecla é a barra invertida)

// Reload que limpa os decalques do seu próprio campo de visão
alias +reloads "+reload; r_cleardecals"
alias -reloads "-reload"

// Chamada de voz útil pro Spy (é o "Spy!" — aponta pro alvo e chama a classe)
bind "CAPSLOCK" "voicemenu 1 1"


// ─────────────────────────────────────────────────────────────────────────────
//  4. TELAS / TOGGLES (nada de cvar fixo poluindo o HUD)
// ─────────────────────────────────────────────────────────────────────────────
bind "F10" "toggle net_graph 0 4"                    // FPS/ping/choke sob demanda
bind "F11" "toggle cl_showpos 0 1"                   // posição/velocidade (treino)
bind "F12" "jpeg"                                    // screenshot
bind "END" "toggle r_drawviewmodel 0 1"              // esconde a arma
bind "PGUP" "incrementvar viewmodel_fov 80 100 5"    // ajusta FOV do viewmodel
bind "PGDN" "incrementvar tf_use_min_viewmodels 0 1 1" // min viewmodel on/off
bind "DEL" "incrementvar cl_crosshair_scale 20 32 1" // tamanho da mira

cl_showpos 0                  // nada de showpos fixo na tela
net_graph 0                   // nada de net_graph fixo (custa frametime)
hud_saytext_time 8            // chat fica 8s na tela (era 5)
cl_autoreload 1               // revolver recarrega sozinho
hud_fastswitch 1              // troca de arma no toque, sem confirmar
hud_combattext 1              // número de dano no alvo
hud_combattext_batching 1     // soma os danos seguidos em um número só
hud_combattext_batching_window 0.5   // (seu valor de sempre)
cl_crosshaircolor 5           // * mantém sua mira customizada (verde, 255 de alpha)
cl_crosshairalpha 255
cl_crosshair_file "crosshair1"
cl_interp_ratio 1             // garantia (o mastercomfig reforça no spy.cfg)
cl_smooth 0                   // sem suavizar a câmera — ajuda o "feel" do flick
tf_hud_no_crosshair_on_scope_zoom 1

// Aparência / preferências suas (mantidas iguais às que você já usava)
fov_desired 90                // FOV máximo de combate
viewmodel_fov 105
tf_use_min_viewmodels 1       // você joga de min viewmodels
mat_monitorgamma 1.6          // seu brilho (padrão é 2.2; menor = imagem mais clara,
                              //  e imagem clara ajuda a ver o brilho de Spy cloaked)

// Aliases de qualidade de vida
alias cleardecals "r_cleardecals"
alias walkway  "exec overrides/walkway"        // treino: digite  walkway
alias spyfkeys "exec overrides/spy_fkeys"      // ativa F1..F9 disfarce direto
alias hudmodel_on  "hud_player_model_on;  echo [HUD] modelo 3D ligado"
alias hudmodel_off "hud_player_model_off; echo [HUD] modelo 3D desligado"
alias bench   "cl_showfps 1; net_graph 4; cl_showpos 1; echo [bench] medindo fps/frametime (unbench pra desligar)"
alias unbench "cl_showfps 0; net_graph 0; cl_showpos 0; echo [bench] off"

// Interp do Spy: 15ms é o padrão do mastercomfig (net_spy).
// Se um dia levar "facada que não registra" com perda de pacote na sua rede,
// rode no console:   net_spy_safe   (30ms = mais seguro)  /  net_spy_fast (volta)
alias net_spy_fast "net_spy; echo [rede] interp do Spy: 15ms (rapido)"
alias net_spy_safe "snapshot_buffer_x1; echo [rede] interp do Spy: 30ms (seguro)"


// ─────────────────────────────────────────────────────────────────────────────
//  5. ÁUDIO
// ─────────────────────────────────────────────────────────────────────────────
snd_surround_speakers 0       // * FONE DE OUVIDO (headphone mode).
                              //   O TF2 adora resetar isso pra "2 speakers" —
                              //   por isso também está no game_overrides.cfg.
snd_mute_losefocus 0          // som continua quando o jogo perde foco
snd_musicvolume 0             // sem música de menu
cl_mute_all_comms 0
cl_disablehtmlmotd 1

// O resto (espacialização, mixagem) é o módulo sound=high no modules.cfg.


// ─────────────────────────────────────────────────────────────────────────────
//  🕵️ DISFARCE — como você escolheu usar: pelo MENU com atalho
//     MOUSE3 ou a tecla 4 = abre o kit -> escolhe classe -> escolhe time
//     b / MOUSE4 = repete o ÚLTIMO disfarce (o jeito rápido no meio da luta)
//     Já disfarçado, 1/2/3 troca a ARMA mostrada pelo disfarce sem re-disfarçar
//     (disfarce com arma errada = denúncia na hora; use sempre a natural da classe)
//     Quer disfarce direto em tecla (F1..F9)? Rode no console:  spyfkeys
// ─────────────────────────────────────────────────────────────────────────────


echo ""
echo "==================================================="
echo "   mintlyy-cfg v3 (SPY MAIN) CARREGADA"
echo "   i5-3470/GT630 | 80Hz | fpscap 120 | som high"
echo "   console: bench | walkway | null/nonull | spyfkeys"
echo "==================================================="
echo ""
