// ============================================================================
//   GAME_OVERRIDES.CFG — roda quando você ENTRA numa partida e a cada troca
//   de classe (o mastercomfig carrega este arquivo nos dois casos).
//   Instalar em: tf/cfg/overrides/game_overrides.cfg
//
//   Regra deste arquivo: SÓ entra aqui o que o TF2 reseta sozinho, ou o que
//   não tem opção no menu do jogo. Se eu colocasse coisa que você muda nas
//   Opções, este arquivo ia desfazer a sua escolha a cada troca de classe.
// ============================================================================

// ─────────────────────────────────────────────────────────────────────────────
//  ÁUDIO — bug clássico: o TF2 reseta "Speaker Configuration" pra 2 speakers
//  sozinho, e você perde parte da direção do som (decloak/passo de Spy).
//  Fone de ouvido = 0 (headphone mode).
// ─────────────────────────────────────────────────────────────────────────────
snd_surround_speakers 0

// ─────────────────────────────────────────────────────────────────────────────
//  Ragdolls sem colidir entre si: menos CPU e o corpo do Dead Ringer falso
//  continua 100% visível/intacto pra você inspecionar. Não tem opção no menu.
// ─────────────────────────────────────────────────────────────────────────────
cl_ragdoll_collide 0

// ─────────────────────────────────────────────────────────────────────────────
//  Tela limpa a cada spawn: sangue e marca de tiro na sua cara viram
//  "informação falsa" (parece que levou dano quando não levou).
// ─────────────────────────────────────────────────────────────────────────────
r_cleardecals

// ─────────────────────────────────────────────────────────────────────────────
//  Se um dia você notar que ALGO está voltando ao padrão no meio da partida
//  (mira, FOV, chat...), é aqui que a linha de conserto vai. Exemplos:
//
//    cl_crosshaircolor 5
//    cl_crosshairalpha 255
//    fov_desired 90
//    hud_saytext_time 8
//
//  A partir de agora você pode desconfiar: se voltou ao padrão em partida,
//  é porque o jogo resetou — e este arquivo é o lugar de travar de volta.
// ─────────────────────────────────────────────────────────────────────────────
