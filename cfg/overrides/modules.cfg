// ============================================================================
//  mintlyy-cfg v3 — MÓDULOS MASTERCOMFIG  (Spy Main Edition)
//  Instalar em: tf/cfg/overrides/modules.cfg
//
//  Alvo desta config:  i5-3470 + GT 630 + 8GB DDR3  |  monitor 80Hz
//  Meta: MÁXIMO de FPS (frametime estável) SEM abrir mão do que ganha jogo
//        de Spy: som posicional, ragdolls (fake de Dead Ringer) e sombras.
//
//  Aqui estão TODOS os módulos, um por um, de propósito: assim o resultado
//  é o mesmo não importa qual preset do mastercomfig você baixe.
//  Referência: https://docs.comfig.app/latest/customization/modules/
// ============================================================================


// ─────────────────────────────────────────────────────────────────────────────
//  1. REDE  — internet de cabo, ping baixo (resposta do mintlyy)
// ─────────────────────────────────────────────────────────────────────────────
packet_rate=standard          // 66 pacotes/s — máximo que os servidores TF2 mandam
snapshot_buffer=auto          // lerp por classe. SPY recebe o preset próprio:
                              //   cl_interp_ratio 1 (15ms) + cl_smooth 0
                              // É o ajuste mais agressivo que o mastercomfig
                              // recomenda pra facada registrar rápido.
packet_size=large             // 1260 bytes — evita fragmentar pacote
bandwidth=6.0Mbps             // teto de envio (não gasta mais internet, só evita overflow)
download=all                  // baixa mapa/som de servidor comunitário


// ─────────────────────────────────────────────────────────────────────────────
//  2. FPS  — monitor 80Hz
// ─────────────────────────────────────────────────────────────────────────────
// 120 = 1.5x o refresh: headroom suficiente pro VSync nunca ser cogitado
// e pro mouse ficar responsivo. Guia rápido:
//   segura SEMPRE 160+ fps  -> fpscap=160 (2x = pacing perfeito)
//   oscila entre 80 e 120   -> fpscap=90  (menos variação de frametime)
//   cai abaixo de 80 em fight -> fpscap=75 (joga estável, sem tearing pesado)
fpscap=120


// ─────────────────────────────────────────────────────────────────────────────
//  3. GRÁFICOS  — prioridade MÁXIMO FPS (GT 630 é o gargalo aqui)
// ─────────────────────────────────────────────────────────────────────────────
lod=low                       // modelo no detalhe mais baixo (CPU + GPU)
lighting=low                  // sem luz dinâmica. (very_low = mais leve ainda,
                              //  mas deixa o mapa chapado escuro)
shading=low                   // sem bumpmap/specular — grande ganho no GT 630
phong=off                     // sem reflexo de "plástico" nas armas
shadows=low                   // sombra "blobby": custo quase zero E ajuda a ver
                              // inimigo atrás de caixa/payload. NÃO recomendo
                              // desligar: você perde informação de graça.
flashlight=off
effects=very_low              // partículas/faíscas quase zero — alívio grande de CPU
tracers=low                   // sem tracer saindo do seu cano (tela limpa pro Spy)
water=low                     // água sem reflexo caro (era "high" na cfg antiga = dor de graça)
post_processing=off           // sem HDR/bloom
color_filter=off
pyrovision=low                // sem vinheta 3D — o pyro_vignette manual virou redundante
romevision=off
motion_blur=off
anti_aliasing=off             // MSAA é luxo de GPU forte
characters=very_low           // sem animação facial (CPU) — silhueta continua igual
decals=off                    // buraco de bala/sangue no chão
decals_models=off
decals_art=off
sprays=keep                   // você gosta de ver spray (custo ~0)
gibs=off                      // sem pedaço de corpo voando (CPU/GPU baixo)
sillygibs=auto                // com gibs=off, o mastercomfig liga o "silly gibs"
                              // (faísca no lugar de sangue). Se preferir sangue
                              // normal: gibs=low + sillygibs=off
props=low                     // sem props do cliente nem folhagem
ragdolls=medium               // * IMPORTANTE PRO SPY: ragdoll com física é como
                              // você identifica FAKE de Dead Ringer. Um FPS de
                              // 1-2 é nada comparado a confundir DR com kill real.
3dsky=off                     // céu 3D desligado (gargalo de fill no GT 630)
jigglebones=off
sheens_speed=slow             // brilho de killstreak em velocidade normal
sheens_tint=high
texture_quality=low           // texturas leves = menos VRAM (GT 630) = menos stutter
                              // quer inimigo mais "nítido" de longe? texture_quality=medium
texture_filter=blocky         // sem filtro de textura (mais FPS, textura "seca")
ropes=off
vsync=off                     // VSync on = input lag de mouse; fuja


// ─────────────────────────────────────────────────────────────────────────────
//  4. HUD  — informação que importa, sem nada que custe GPU
// ─────────────────────────────────────────────────────────────────────────────
hud_player_model=off          // * ERA "on": o modelo 3D no canto custa GPU (médio)
                              // no GT 630. Se você gosta de ver seu disfarce ali,
                              // troque pra on — mas é FPS que você paga.
hud_server_text=on            // texto do servidor no meio da tela (aviso útil)
hud_contracts=hide            // sem painel de contrato no canto
hud_panels=high               // painel de vida do alvo que você olha (info de Spy)
hud_avatars=off               // avatar no target ID é custo de CPU/GPU à toa
match_hud=on                  // relógio/caps no topo — informação de partida
messages=on                   // chat
killfeed=on                   // killfeed (essencial: ver quem matou quem)
killstreaks=low               // banner de killstreak opaco (mais leve que translúcido)
hud_achievement=off           // sem rastreador de conquista na tela
console=on
htmlmotd=off                  // sem MOTD em HTML (loja/propaganda de servidor = lag spike)
outlines=off                  // sem contorno através da parede (CPU+GPU alto).
                              // outlines=medium mantém contorno de carrinho/maleta
                              // e some com o de player. outlines=low = só os nomes.


// ─────────────────────────────────────────────────────────────────────────────
//  5. SOM  — a arma número 1 do Spy: ouvir decloak, passo e recarga
// ─────────────────────────────────────────────────────────────────────────────
sound=high                    // espacialização e posicionamento COMPLETOS.
                              // (a cfg antiga do mintlyy estava em "low": snd_pitchquality 0 +
                              //  dsp_slow_cpu 1 = som achatado, direção pior)
// Se o FPS continuar sobrando: sound=very_high
//   -> espacializa na hora (sem adiar 1 frame) + pitch smoothing.
//      É o nível máximo de áudio "de verdade". Custa um pouco de CPU.
// Se der stutter em servidor de 32: volte pra sound=high (ou medium se o PC apertar).
voice_chat=on
party_mode=invite             // só entra no seu grupo quem você convidar


// ─────────────────────────────────────────────────────────────────────────────
//  6. SE UM DIA VOCÊ QUISER MAIS FPS AINDA (troque e rode: run_modules)
// ─────────────────────────────────────────────────────────────────────────────
// lighting=very_low        // mapa chapado, mais fps
// water=very_low           // água sem refração
// shadows=off              // último 1-2 fps, mas perde sombra de inimigo
// characters=low           // nada muda (a silhueta é a mesma)
// 3dsky já é off | props já é low
// killstreaks=off          // sem banner de killstreak
// match_hud=off            // tira o relógio/caps do topo
// hud_panels=low           // target ID opaco (um pouco mais leve)
// sound=medium             // só se o PC estiver sofrendo de verdade (piora direção de som)
