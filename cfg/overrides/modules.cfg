// ============================================================================
//  mintlyy-cfg v2 — MODULOS MASTERCOMFIG
//  Instalar em: tf/cfg/overrides/modules.cfg
//  Graficos, som e rede ficam TODOS aqui (o autoexec so tem binds/preferencias).
//  Valores validos: https://docs.comfig.app/latest/customization/modules/
// ============================================================================

// ───── REDE ─────
packet_rate=standard          // 66 pacotes/s (maximo dos servidores TF2)
snapshot_buffer=auto          // lerp ideal POR CLASSE — o Spy recebe tuning proprio
bandwidth=6.0Mbps             // limite de envio (nao aumenta consumo, so evita overflow)
download=all                  // baixa mapas/conteudo de servidores comunitarios

// ───── FPS ─────
// Monitor 80Hz: 120 da headroom com pacing estavel.
// Se o PC segura SEMPRE acima de 80: mude pra fpscap=160 (2x o refresh = ritmo perfeito).
// Se oscitar demais pra baixo: fpscap=75.
fpscap=120

// ───── GRAFICOS — prioridade: MAXIMO FPS ─────
lod=low                       // modelos no menor detalhe
lighting=low
shading=low
phong=off
shadows=low                   // sombras "blobby" (custo ~zero) e revelam Spy
                              // INIMIGO cloaked. Nao recomendo desligar, mas se
                              // quiser o ultimo 1-2 fps: shadows=off
flashlight=off
effects=very_low
tracers=low
water=low                     // * ERA "high" — reflexo 1K pesava de graca
post_processing=off
color_filter=off
pyrovision=low
romevision=off
motion_blur=off
anti_aliasing=off
characters=very_low           // sem olhos/dentes/expressoes faciais
decals=off
decals_models=off
decals_art=off
sprays=keep                   // voce gosta de ver sprays (custo minimo)
gibs=off
sillygibs=auto                // mastercomfig escolhe o mais leve sozinho
props=low
ragdolls=medium               // * IMPORTANTE PRO SPY: ragdoll com fisica deixa
                              // voce distinguir fake do Dead Ringer
3dsky=off
jigglebones=off
sheens_speed=fast
sheens_tint=low
texture_quality=low
texture_filter=blocky
ropes=off
vsync=off
hud_player_model=on           // modelo 3D no HUD (sua preferencia, custo ~0)
outlines=off

// ───── SOM ─────
sound=high                    // * O FIX MAIS IMPORTANTE PRO SPY: espacializacao
                              // completa = direcao de decloak/passos.
                              // Sua cfg antiga DEGRAVA o som por engano.
                              // Se o PC aguentar: sound=very_high (espacializa
                              // instantaneamente + pitch smoothing)
